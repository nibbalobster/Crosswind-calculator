<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosswind Calculator</title>
<meta name="theme-color" content="#0b6bcb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Crosswind">
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #15202b;
    --muted: #64707d;
    --line: #d9dee4;
    --accent: #0b6bcb;
    --runway: #2b323a;
    --marking: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419;
      --card: #1a2129;
      --text: #eef2f6;
      --muted: #93a0ad;
      --line: #2c3742;
      --accent: #4da3ff;
      --runway: #3a444f;
      --marking: #eef2f6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 28px;
  }
  h1 {
    margin: 0 0 16px;
    font-size: 1.9rem;
    text-align: center;
  }
  .inputs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .inputs + .inputs { margin-top: 10px; }
  label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
  }
  input, select {
    width: 100%;
    margin-top: 4px;
    padding: 10px 8px;
    font: inherit;
    font-size: 1.25rem;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  select { padding: 10px 4px; }
  input[type=number] { appearance: textfield; -moz-appearance: textfield; }
  input::-webkit-inner-spin-button,
  input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input:disabled, select:disabled { opacity: 0.45; }
  .pair { display: flex; gap: 4px; }
  .pair input { flex: 1 1 0; min-width: 0; }
  .pair input { padding: 10px 2px; }
  .pair select { flex: 0 0 auto; width: auto; }
  .hint {
    margin: 8px 0 0;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }
  input:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .compass {
    display: block;
    width: 100%;
    max-width: 340px;
    margin: 18px auto;
  }
  .ring { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .notch { stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; }
  .cardinal { fill: var(--muted); font-size: 9px; font-weight: 600; text-anchor: middle; }
  .surface { fill: var(--runway); }
  .marking { fill: var(--marking); }
  .rwy-number {
    fill: var(--marking);
    font-size: 11px;
    font-weight: 700;
    text-anchor: middle;
  }
  /* painted like a real runway: each number faces the aircraft landing on it,
     so the far-end number is turned 180° in place */
  #num-far {
    transform-box: fill-box;
    transform-origin: center;
    transform: rotate(180deg);
  }
  .wind { fill: var(--accent); }
  #runway, #wind {
    transform-origin: 100px 100px;
    transition: transform 0.4s ease;
  }
  .results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .tile {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 8px 14px;
    text-align: center;
  }
  .tile .name {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .tile .value {
    font-size: clamp(3rem, 16vw, 5rem);
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .tile .unit, .tile .gust {
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 1.2em;
  }
  .tile .gust { font-weight: 600; }
  .update-banner {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 448px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 12px 12px 16px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
    font-size: 0.95rem;
  }
  .update-banner[hidden] { display: none; }
  .update-banner span { flex: 1; }
  .update-banner button {
    font: inherit;
    font-weight: 600;
    padding: 8px 14px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
  }
  body:has(.update-banner:not([hidden])) main { padding-bottom: 96px; }
  footer {
    margin-top: 22px;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <h1>Crosswind Calculator</h1>

  <div class="inputs">
    <label>Runway heading (°)
      <input id="heading" type="number" inputmode="numeric" min="0" max="360" value="270">
    </label>
    <label>Wind direction (°)
      <input id="direction" type="number" inputmode="numeric" min="0" max="360" value="300">
    </label>
    <label>Wind speed (kt)
      <input id="speed" type="number" inputmode="numeric" min="0" value="15">
    </label>
  </div>
  <div class="inputs">
    <label>Gust (kt)
      <input id="gust" type="number" inputmode="numeric" min="0" placeholder="–">
    </label>
    <label>Wind is
      <select id="reference">
        <option value="magnetic">MAG</option>
        <option value="true">TRUE</option>
      </select>
    </label>
    <label>Variation (°)
      <span class="pair">
        <input id="variation" type="number" inputmode="numeric" min="0" max="180" placeholder="0">
        <select id="variation-side" aria-label="Variation east or west">
          <option value="E">E</option>
          <option value="W">W</option>
        </select>
      </span>
    </label>
  </div>
  <p class="hint" id="hint"></p>

  <svg class="compass" viewBox="0 0 200 200" role="img" aria-label="Runway and wind direction">
    <circle class="ring" cx="100" cy="100" r="86"/>
    <text class="cardinal" x="100" y="9">N</text>
    <text class="cardinal" x="194" y="103">E</text>
    <text class="cardinal" x="100" y="198">S</text>
    <text class="cardinal" x="6" y="103">W</text>
    <line class="notch" x1="100" y1="9" x2="100" y2="19" transform="rotate(45 100 100)"/>
    <line class="notch" x1="100" y1="9" x2="100" y2="19" transform="rotate(135 100 100)"/>
    <line class="notch" x1="100" y1="9" x2="100" y2="19" transform="rotate(225 100 100)"/>
    <line class="notch" x1="100" y1="9" x2="100" y2="19" transform="rotate(315 100 100)"/>

    <g id="runway">
      <rect class="surface" x="84" y="28" width="32" height="144" rx="2"/>
      <!-- side stripes -->
      <rect class="marking" x="85.2" y="30" width="0.7" height="140"/>
      <rect class="marking" x="114.1" y="30" width="0.7" height="140"/>
      <!-- centreline -->
      <rect class="marking" x="99.25" y="68" width="1.5" height="8"/>
      <rect class="marking" x="99.25" y="82" width="1.5" height="8"/>
      <rect class="marking" x="99.25" y="96" width="1.5" height="8"/>
      <rect class="marking" x="99.25" y="110" width="1.5" height="8"/>
      <rect class="marking" x="99.25" y="124" width="1.5" height="8"/>
      <!-- markings for one end, mirrored to the other end below -->
      <g id="rwy-end" class="marking">
        <!-- threshold -->
        <rect x="87" y="162" width="2" height="7"/>
        <rect x="90" y="162" width="2" height="7"/>
        <rect x="93" y="162" width="2" height="7"/>
        <rect x="96" y="162" width="2" height="7"/>
        <rect x="102" y="162" width="2" height="7"/>
        <rect x="105" y="162" width="2" height="7"/>
        <rect x="108" y="162" width="2" height="7"/>
        <rect x="111" y="162" width="2" height="7"/>
        <!-- aiming point -->
        <rect x="88.5" y="134" width="6" height="11"/>
        <rect x="105.5" y="134" width="6" height="11"/>
        <!-- touchdown zone, double bars -->
        <rect x="89" y="122" width="2" height="7"/>
        <rect x="92.5" y="122" width="2" height="7"/>
        <rect x="105.5" y="122" width="2" height="7"/>
        <rect x="109" y="122" width="2" height="7"/>
      </g>
      <use href="#rwy-end" transform="rotate(180 100 100)"/>
      <!-- the number you see when lined up on this heading sits at the near end;
           both numbers turn with the runway, each facing its own approach -->
      <text id="num-near" class="rwy-number" x="100" y="154">27</text>
      <text id="num-far" class="rwy-number" x="100" y="54">09</text>
    </g>

    <g id="wind">
      <path class="wind" d="M100 30 L92 16 L97 16 L97 2 L103 2 L103 16 L108 16 Z"/>
    </g>
  </svg>

  <div class="results">
    <div class="tile">
      <div class="name" id="head-name">Headwind</div>
      <div class="value" id="head-value">–</div>
      <div class="unit">kt</div>
      <div class="gust" id="head-gust"></div>
    </div>
    <div class="tile">
      <div class="name">Crosswind</div>
      <div class="value" id="cross-value">–</div>
      <div class="unit" id="cross-side">kt</div>
      <div class="gust" id="cross-gust"></div>
    </div>
  </div>

  <footer>Learning project — not for operational use.</footer>
</main>

<div class="update-banner" id="update-banner" role="status" hidden>
  <span>A new version is available.</span>
  <button type="button" id="update-reload">Reload</button>
</div>

<script>
  // Returns { headwind, crosswind } in knots.
  // headwind: positive = headwind, negative = tailwind.
  // crosswind: positive = from the right, negative = from the left.
  function windComponents(runwayHeading, windDirection, windSpeed) {
    const angle = (windDirection - runwayHeading) * Math.PI / 180;
    return {
      headwind: windSpeed * Math.cos(angle),
      crosswind: windSpeed * Math.sin(angle),
    };
  }

  const el = (id) => document.getElementById(id);
  const headingInput = el('heading');
  const directionInput = el('direction');
  const speedInput = el('speed');
  const gustInput = el('gust');
  const referenceInput = el('reference');
  const variationInput = el('variation');
  const variationSideInput = el('variation-side');
  const HINT = 'ATIS and tower winds are magnetic; METAR and TAF winds are true.';

  // Keep a running angle so the symbol turns the short way round (350° → 010°).
  const turned = { runway: 0, wind: 0 };
  function rotateTo(id, degrees) {
    const delta = ((degrees - turned[id]) % 360 + 540) % 360 - 180;
    turned[id] += delta;
    el(id).style.transform = `rotate(${turned[id]}deg)`;
  }

  function readDegrees(input) {
    const value = parseFloat(input.value);
    return value >= 0 && value <= 360 ? value : null;
  }

  // Signed variation in degrees (east positive), 0 for a magnetic wind,
  // null if the box holds something out of range. Blank counts as 0.
  function readVariation() {
    if (referenceInput.value === 'magnetic') return 0;
    if (variationInput.value === '') return 0;
    const value = parseFloat(variationInput.value);
    if (!(value >= 0 && value <= 180)) return null;
    return variationSideInput.value === 'E' ? value : -value;
  }

  function runwayNumber(heading) {
    const n = Math.round(heading / 10) % 36 || 36;
    return String(n).padStart(2, '0');
  }

  // sin/cos leave tiny errors (7.4999999 instead of 7.5), so trim them before
  // rounding, and round halves away from zero so left and right match.
  function roundKnots(value) {
    const clean = parseFloat(Math.abs(value).toFixed(6));
    return Math.sign(value) * Math.round(clean);
  }

  function showBlank() {
    el('head-name').textContent = 'Headwind';
    el('head-value').textContent = '–';
    el('cross-value').textContent = '–';
    el('cross-side').textContent = 'kt';
    el('head-gust').textContent = '';
    el('cross-gust').textContent = '';
  }

  function update() {
    const heading = readDegrees(headingInput);
    const variation = readVariation();
    const windInput = readDegrees(directionInput);
    const speed = parseFloat(speedInput.value);
    const gust = parseFloat(gustInput.value);

    const isTrue = referenceInput.value === 'true';
    variationInput.disabled = !isTrue;
    variationSideInput.disabled = !isTrue;

    // Runway headings are magnetic, so a true wind is converted first:
    // magnetic = true − east variation ("east is least, west is best").
    const direction = windInput !== null && variation !== null
      ? ((windInput - variation) % 360 + 360) % 360
      : null;
    el('hint').textContent = isTrue && direction !== null
      ? `Magnetic wind: ${String(Math.round(direction) % 360 || 360).padStart(3, '0')}°`
      : HINT;

    if (heading !== null) {
      rotateTo('runway', heading);
      el('num-near').textContent = runwayNumber(heading);
      el('num-far').textContent = runwayNumber(heading + 180);
    }
    if (direction !== null) rotateTo('wind', direction);

    if (heading === null || direction === null || !(speed >= 0)) return showBlank();

    const result = windComponents(heading, direction, speed);
    const head = roundKnots(result.headwind);
    const cross = roundKnots(result.crosswind);

    el('head-name').textContent = head < 0 ? 'Tailwind' : 'Headwind';
    el('head-value').textContent = Math.abs(head);
    el('cross-value').textContent = Math.abs(cross);
    el('cross-side').textContent =
      cross > 0 ? 'kt from right' : cross < 0 ? 'kt from left' : 'kt';

    // A gust only counts if it is stronger than the steady wind.
    if (gust > speed) {
      const peak = windComponents(heading, direction, gust);
      el('head-gust').textContent = `gust ${Math.abs(roundKnots(peak.headwind))}`;
      el('cross-gust').textContent = `gust ${Math.abs(roundKnots(peak.crosswind))}`;
    } else {
      el('head-gust').textContent = '';
      el('cross-gust').textContent = '';
    }
  }

  [headingInput, directionInput, speedInput, gustInput,
    referenceInput, variationInput, variationSideInput].forEach((input) =>
    input.addEventListener('input', update));
  update();

  // Offline support and update notice. Service workers need http(s), so
  // nothing happens when the file is opened straight from disk.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const banner = el('update-banner');
    let waitingWorker = null;
    const offerUpdate = (worker) => {
      waitingWorker = worker;
      banner.hidden = false;
    };

    navigator.serviceWorker.register('sw.js').then((registration) => {
      // A new version may already be installed and waiting from an earlier visit.
      if (registration.waiting && navigator.serviceWorker.controller) {
        offerUpdate(registration.waiting);
      }
      registration.addEventListener('updatefound', () => {
        const worker = registration.installing;
        worker.addEventListener('statechange', () => {
          // Only an update, not the very first install, gets the banner.
          if (worker.state === 'installed' && navigator.serviceWorker.controller) {
            offerUpdate(worker);
          }
        });
      });
      // An installed app can stay open for days; look again when it comes back.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') registration.update();
      });
    });

    // Reload only after the user asked; the first install also changes the
    // controller (clients.claim) and must not reload the page.
    let updateRequested = false;
    el('update-reload').addEventListener('click', () => {
      if (!waitingWorker) return;
      updateRequested = true;
      waitingWorker.postMessage('skipWaiting');
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!updateRequested) return;
      updateRequested = false;
      location.reload();
    });
  }
</script>
</body>
</html>
